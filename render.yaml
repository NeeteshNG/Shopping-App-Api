databases:
  - name: shopping-app-db
    databaseName: shopping_app
    user: shopping_app_user
    plan: free

services:
  # Backend API
  - type: web
    name: shopping-app-backend
    runtime: python
    plan: free
    rootDir: backend_api
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn backend_api.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shopping-app-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: "3.11.4"

  # Frontend
  - type: web
    name: shopping-app-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: shopping-app-backend
          property: host
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
